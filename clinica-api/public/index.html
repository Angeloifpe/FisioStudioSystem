let filtroPacientes = { situacao: '', busca: '' };

async function telaPacientes(main) {
  const params = new URLSearchParams();
  if (filtroPacientes.situacao) params.set('situacao', filtroPacientes.situacao);
  if (filtroPacientes.busca) params.set('busca', filtroPacientes.busca);
  const lista = await api('GET', '/pacientes?' + params);
  if (!estado.pacienteSel && lista[0]) estado.pacienteSel = lista[0].id;

  main.innerHTML = `<div class="painel">
    <div><h2>Pacientes</h2><p class="subtitulo">${plural(lista.length, 'paciente', 'pacientes')}</p></div>
    <div class="pacientes-layout">
      <div class="cartao">
        <input type="search" id="buscaPac" placeholder="Buscar por nome ou CPF" value="${esc(filtroPacientes.busca)}">
        <select id="situacaoPac" style="margin-top:8px">
          <option value="">Todas as situações</option>
          ${Object.entries(SITUACAO).map(([v, [t]]) => `<option value="${v}" ${v === filtroPacientes.situacao ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
        <div style="margin-top:10px">${lista.length ? lista.map((p) => `
          <button class="paciente-linha" data-pac="${p.id}" aria-current="${p.id === estado.pacienteSel}">
            <span><b>${esc(p.nome_completo)}</b><small>${esc(p.telefone)}</small></span>${selo(SITUACAO, p.situacao)}${liberacoes(p)}
          </button>`).join('') : '<p class="vazio">Nenhum paciente encontrado.</p>'}</div>
      </div>
      <div id="ficha" class="cartao ficha"><p class="vazio">Escolha um paciente.</p></div>
    </div>
  </div>`;

  let espera;
  $('#buscaPac', main).oninput = (e) => { clearTimeout(espera); espera = setTimeout(() => { filtroPacientes.busca = e.target.value.trim(); desenhar(); }, 350); };
  $('#situacaoPac', main).onchange = (e) => { filtroPacientes.situacao = e.target.value; desenhar(); };
  main.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.pac) { estado.pacienteSel = b.dataset.pac; desenhar(); }
    if (b.dataset.situacao) mudarSituacao(b.dataset.situacao, b.dataset.valor, b.dataset.nome);
    if (b.dataset.registrar) registrarSessao(b.dataset.registrar, b.dataset.nome);
    if ('fixar' in b.dataset) fixarTurma(await api('GET', `/pilates/fixos?paciente_id=${b.dataset.paciente}`), b.dataset.paciente);
    if (b.dataset.desfazerFixo) desfazerFixo(b.dataset.desfazerFixo, b.dataset.nome);
    if (b.dataset.liberarAvaliacao) {
      const r = await perguntar({ titulo: 'Liberar nova avaliação',
        texto: `${esc(b.dataset.nome)} não foi liberado(a) numa avaliação. Liberando, o paciente pode marcar uma nova avaliação (de pilates ou de fisioterapia) e recebe um aviso. O que ele já tinha liberado continua liberado.`,
        campos: [{ nome: 'motivo', tipo: 'area', rotulo: 'Mensagem para o paciente (opcional)' }], botao: 'Liberar' });
      if (r) executar(() => api('POST', `/pacientes/${b.dataset.liberarAvaliacao}/liberar-nova-avaliacao`, { motivo: r.motivo || undefined }), 'Nova avaliação liberada. O paciente foi avisado.');
    }
  };
  if (estado.pacienteSel && lista.some((p) => p.id === estado.pacienteSel)) desenharFicha(estado.pacienteSel);
}

async function desenharFicha(id) {
  const [p, h, fixos] = await Promise.all([api('GET', `/pacientes/${id}`), api('GET', `/pacientes/${id}/historico`), api('GET', `/pilates/fixos?paciente_id=${id}`)]);
  const acoes = [];
  if (p.nova_avaliacao_bloqueada || p.situacao === 'NAO_LIBERADO') acoes.push(`<button class="btn prim" data-liberar-avaliacao="${p.id}" data-nome="${esc(p.nome_completo)}">Liberar nova avaliação${p.nova_avaliacao_pedida_em ? ' (pedido)' : ''}</button>`);
  if (['ALTA', 'INTERROMPIDO'].includes(p.situacao)) acoes.push(`<button class="btn prim" data-situacao="${p.id}" data-valor="AGUARDANDO_AVALIACAO" data-nome="${esc(p.nome_completo)}">Reabrir cadastro</button>`);
  if (p.situacao === 'LIBERADO') acoes.push(
    `<button class="btn" data-situacao="${p.id}" data-valor="ALTA" data-nome="${esc(p.nome_completo)}">Dar alta</button>`,
    `<button class="btn perigo" data-situacao="${p.id}" data-valor="INTERROMPIDO" data-nome="${esc(p.nome_completo)}">Interromper tratamento</button>`);
  acoes.push(`<button class="btn" data-registrar="${p.id}" data-nome="${esc(p.nome_completo)}">Registrar sessão</button>`);

  $('#ficha').innerHTML = `
    <div class="cabecalho-linha"><h3 style="margin:0">${esc(p.nome_completo)}</h3>${selo(SITUACAO, p.situacao)}${liberacoes(p)}</div>
    <dl>
      <dt>Celular</dt><dd>${esc(p.telefone)}</dd>
      <dt>E-mail</dt><dd>${esc(p.email)}</dd>
      <dt>CPF</dt><dd>${esc(p.cpf)}</dd>
      <dt>Nascimento</dt><dd>${fmtData(p.data_nascimento)}</dd>
      ${p.endereco ? `<dt>Endereço</dt><dd>${esc(p.endereco)}</dd>` : ''}
    </dl>
    <div class="acoes">${acoes.join('')}</div>
    ${p.situacao === 'LIBERADO' ? `<div style="margin-top:18px">${cartaoFixos(fixos, p.id)}</div>` : ''}

    ${p.avaliacoes.length ? `<h3 style="margin-top:20px">Avaliações</h3>${p.avaliacoes.map((a) => `
      <div class="registro"><small>${fmtDiaCurto(a.data_avaliacao)} · Avaliação de ${PARA[a.avaliacao_para || 'AMBAS']} · ${a.resultado === 'LIBERADO' ? `Liberado para ${PARA[a.liberado_para || 'AMBAS']}` : 'Não liberado'}</small>${esc(a.observacoes || 'Sem observações')}</div>`).join('')}` : ''}

    <h3 style="margin-top:20px">Registros de sessão</h3>
    ${h.registros.length ? h.registros.map((r) => `<div class="registro"><small>${fmtData(r.data_atendimento)}</small>${esc(r.observacoes || 'Sem observações')}</div>`).join('') : '<p class="vazio">Nenhum registro ainda.</p>'}

    <h3 style="margin-top:20px">Atendimentos</h3>
    ${h.agendamentos.length ? h.agendamentos.slice(0, 20).map((a) => `
      <div class="historico-item">${seloMod(a.modalidade, a.experimental)}<span>${fmtQuando(a.inicio)}</span>${selo(STATUS, a.status)}</div>`).join('') : '<p class="vazio">Nenhum atendimento.</p>'}

    ${p.mudancas_situacao.length ? `<h3 style="margin-top:20px">Mudanças de situação</h3>${p.mudancas_situacao.map((m) => `
      <div class="historico-item"><span>${fmtDiaCurto(m.alterado_em)}</span>${selo(SITUACAO, m.situacao_anterior)} → ${selo(SITUACAO, m.situacao_nova)}<span class="subtitulo" style="margin:0">${esc(m.motivo || '')}</span></div>`).join('')}` : ''}
  `;
}

async function mudarSituacao(id, valor, nome) {
  const textos = {
    AGUARDANDO_AVALIACAO: ['Reabrir cadastro', `${esc(nome)} volta a aguardar avaliação e pode agendar uma nova.`, 'Reabrir'],
    ALTA: ['Dar alta', `${esc(nome)} recebe alta. Os agendamentos futuros são cancelados.`, 'Dar alta'],
    INTERROMPIDO: ['Interromper tratamento', `O tratamento de ${esc(nome)} é interrompido. Os agendamentos futuros são cancelados.`, 'Interromper'],
  };
  const [titulo, texto, botao] = textos[valor];
  const r = await perguntar({ titulo, texto, campos: [{ nome: 'motivo', tipo: 'area', rotulo: 'Motivo (opcional)' }], botao, perigo: valor === 'INTERROMPIDO' });
  if (r) executar(() => api('POST', `/pacientes/${id}/situacao`, { situacao: valor, motivo: r.motivo || undefined }), 'Situação atualizada. O paciente foi avisado.');
}

async function telaAbrirHorarios(main) {
  main.innerHTML = `<div class="painel">
    <div><h2>Abrir horários</h2><p class="subtitulo">Crie os horários em que os pacientes podem agendar. A clínica funciona de segunda a sexta, menos nos feriados (eles são pulados). Alunos com horário fixo entram automaticamente nas aulas de pilates novas.</p></div>
    <div class="cartao">
      <form id="formHorarios">
        <label class="campo">Tipo de atendimento</label>
        <div class="filtro-mod" id="escolhaMod">
          ${['PILATES', 'FISIOTERAPIA', 'AVALIACAO'].map((m, i) => `<button type="button" class="mod mod-${m}" data-m="${m}" aria-pressed="${i === 0}">${MOD[m]}</button>`).join('')}
        </div>
        <div class="linha-campos">
          <div><label class="campo" for="hDe">Do dia</label><input type="date" id="hDe" value="${diaUtil(estado.dia || diaLocal())}" required></div>
          <div><label class="campo" for="hAte">Até o dia</label><input type="date" id="hAte" value="${diaUtil(estado.dia || diaLocal())}" required></div>
        </div>
        <label class="campo">Dias da semana</label>
        <div class="filtro-mod" id="diasSemana">
          ${['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex'].map((d, i) => i ? `<button type="button" class="mod" style="--c:var(--tinta);--cc:#e4ebe8" data-d="${i}" aria-pressed="true">${d}</button>` : '').join('')}
        </div>
        <div class="linha-campos">
          <div><label class="campo" for="hInicio">Primeiro horário</label><input type="time" id="hInicio" value="08:00" required></div>
          <div><label class="campo" for="hDur">Duração (minutos)</label><input type="number" id="hDur" value="60" min="15" step="5" required></div>
          <div><label class="campo" for="hQtd">Horários seguidos por dia</label><input type="number" id="hQtd" value="1" min="1" max="12" required></div>
        </div>
        <p class="subtitulo" id="previa" style="margin-top:14px"></p>
        <p><button class="btn prim">Abrir horários</button></p>
      </form>
    </div>
  </div>`;

  const f = $('#formHorarios', main);
  const escolhidos = () => [...main.querySelectorAll('#diasSemana [aria-pressed="true"]')].map((b) => Number(b.dataset.d));
  const modalidade = () => main.querySelector('#escolhaMod [aria-pressed="true"]').dataset.m;
  const pulados = new Set();
  const gerar = () => {
    pulados.clear();
    const lista = [];
    const dias = escolhidos();
    let dia = $('#hDe', main).value;
    const ate = $('#hAte', main).value;
    const dur = Number($('#hDur', main).value);
    const qtd = Number($('#hQtd', main).value);
    for (let guarda = 0; dia && ate && dia <= ate && guarda < 62; guarda++, dia = somarDias(dia, 1)) {
      if (!dias.includes(new Date(`${dia}T12:00:00`).getDay())) continue;
      if (FERIADOS.has(dia)) { pulados.add(dia); continue; }
      let ini = new Date(`${dia}T${$('#hInicio', main).value}:00`);
      for (let i = 0; i < qtd; i++) {
        const fim = new Date(ini.getTime() + dur * 60000);
        lista.push({ modalidade: modalidade(), inicio: ini.toISOString(), fim: fim.toISOString() });
        ini = fim;
      }
    }
    return lista;
  };
  const previa = () => {
    const l = gerar();
    const nome = MOD[modalidade()].toLowerCase();
    $('#previa', main).textContent = !l.length
      ? 'Nenhum horário com essas escolhas. Confira as datas e os dias da semana.'
      : l.length === 1
        ? `Será aberto 1 horário de ${nome}: ${fmtQuando(l[0].inicio)}.`
        : `Serão abertos ${l.length} horários de ${nome}, de ${fmtQuando(l[0].inicio)} até ${fmtQuando(l.at(-1).inicio)}.`;
    if (pulados.size) $('#previa', main).textContent += ` Feriado pulado: ${[...pulados].map((d) => `${fmtData(d)} (${FERIADOS.get(d)})`).join(', ')}.`;
  };
  main.querySelectorAll('#escolhaMod button').forEach((b) => (b.onclick = () => { main.querySelectorAll('#escolhaMod button').forEach((x) => x.setAttribute('aria-pressed', x === b)); previa(); }));
  main.querySelectorAll('#diasSemana button').forEach((b) => (b.onclick = () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); previa(); }));
  f.oninput = previa;
  previa();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const lista = gerar();
    if (!lista.length) return toast('Nenhum horário para abrir. Confira as datas e os dias da semana.', 'erro');
    if (lista.length > 200) return toast('São muitos horários de uma vez (máximo 200). Diminua o período.', 'erro');
    const r = await executar(() => api('POST', '/horarios', lista), lista.length === 1 ? 'Horário aberto.' : `${lista.length} horários abertos.`);
    if (r) irPara('agenda', { dia: diaLocal(new Date(lista[0].inicio)) });
  };
}

async function telaFeriados(main) {
  const hoje = diaLocal();
  const lista = await api('GET', `/feriados?de=${hoje}&ate=${somarDias(hoje, 364)}`);
  const ano = Number(hoje.slice(0, 4));
  const proximo = (mmdd) => (`${ano}-${mmdd}` >= hoje ? `${ano}-${mmdd}` : `${ano + 1}-${mmdd}`);
  const pAno = pascoa(ano) > hoje ? ano : ano + 1;
  const sugestoes = [
    [proximo('06-24'), 'São João', 'MUNICIPAL'],
    [somarDias(pascoa(pAno), -48), 'Carnaval (segunda)', 'FACULTATIVO'],
    [somarDias(pascoa(pAno), -47), 'Carnaval (terça)', 'FACULTATIVO'],
    [somarDias(pascoa(pAno), 60), 'Corpus Christi', 'FACULTATIVO'],
  ].filter(([d]) => !lista.some((f) => f.data === d));
  const TIPO = { NACIONAL: 'Nacional', ESTADUAL: 'Pernambuco', MUNICIPAL: 'Municipal', FACULTATIVO: 'Ponto facultativo', OUTRO: 'Outro' };

  main.innerHTML = `<div class="painel">
    <div><h2>Feriados</h2><p class="subtitulo">Nos feriados a clínica não abre: não dá para abrir horários e, ao cadastrar um feriado, os atendimentos do dia são cancelados e os pacientes avisados, sem remarcação. Para fechar um dia por outro motivo com remarcação, use "Cancelar o dia" na Agenda.</p></div>
    <div class="grade-2">
      <div class="cartao">
        <h3>Acrescentar feriado</h3>
        <form id="formFeriado">
          <div class="linha-campos">
            <div><label class="campo" for="fData">Dia</label><input type="date" id="fData" required></div>
            <div><label class="campo" for="fTipo">Tipo</label><select id="fTipo">
              <option value="MUNICIPAL">Municipal</option><option value="FACULTATIVO">Ponto facultativo</option><option value="OUTRO">Outro (recesso, evento...)</option>
            </select></div>
          </div>
          <label class="campo" for="fNome">Nome</label><input type="text" id="fNome" placeholder="Ex.: Padroeiro da cidade" required>
          <p><button class="btn prim">Acrescentar</button></p>
        </form>
        ${sugestoes.length ? `<label class="campo">Sugestões que costumam fechar em Pernambuco</label>
          <div class="contas-teste">${sugestoes.map(([d, n, t]) => `<button class="btn peq" data-sugestao="${d}" data-nome="${esc(n)}" data-tipo="${t}">${esc(n)} · ${fmtData(d)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="cartao">
        <h3>Próximos 12 meses</h3>
        <p class="subtitulo" style="margin:0 0 6px">Nacionais e o estadual de Pernambuco (6 de março, Data Magna) já vêm cadastrados.</p>
        ${lista.length ? lista.map((f) => `<div class="lista-item">
          <div class="texto"><b>${esc(f.nome)}</b><small>${new Date(`${f.data}T12:00:00`).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })} · ${TIPO[f.tipo] || f.tipo}</small></div>
          <div class="acoes"><button class="btn peq link" data-remover="${f.data}" data-nome="${esc(f.nome)}">Remover</button></div>
        </div>`).join('') : '<p class="vazio">Nenhum feriado nos próximos meses.</p>'}
      </div>
    </div>
  </div>`;

  const adicionar = async (dataF, nome, tipo) => {
    const ok = await perguntar({
      titulo: `Acrescentar feriado: ${nome}`,
      texto: `${esc(fmtDia(`${dataF}T12:00:00`))}. Os atendimentos marcados nesse dia serão cancelados e cada paciente recebe um aviso, com a remarcação liberada.`,
      botao: 'Acrescentar feriado',
    });
    if (!ok) return;
    await executar(async () => {
      const r = await api('POST', '/feriados', { data: dataF, nome, tipo });
      await carregarFeriados();
      return r;
    }, (r) => r.atendimentos_cancelados ? `Feriado acrescentado; ${plural(r.atendimentos_cancelados, 'atendimento cancelado', 'atendimentos cancelados')} e pacientes avisados.` : 'Feriado acrescentado.');
  };

  $('#formFeriado', main).onsubmit = (e) => { e.preventDefault(); adicionar($('#fData', main).value, $('#fNome', main).value.trim(), $('#fTipo', main).value); };
  main.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.sugestao) adicionar(b.dataset.sugestao, b.dataset.nome, b.dataset.tipo);
    if (b.dataset.remover) {
      const ok = await perguntar({ titulo: 'Remover feriado', texto: `${esc(b.dataset.nome)} (${fmtData(b.dataset.remover)}). Depois disso você pode abrir horários nesse dia. Atendimentos já cancelados não voltam.`, botao: 'Remover', perigo: true });
      if (ok) executar(async () => { await api('DELETE', `/feriados/${b.dataset.remover}`); await carregarFeriados(); }, 'Feriado removido.');
    }
  };
}
