<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FisioStudio — testes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7d6d'/%3E%3Ccircle cx='16' cy='9' r='4' fill='white'/%3E%3Cpath d='M9 26c1-6 4-10 7-10s6 4 7 10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #eef3f1;
    --superficie: #ffffff;
    --tinta: #18302b;
    --suave: #5c6f6a;
    --linha: #d6e0dc;
    --primaria: #2f7d6d;
    --primaria-clara: #e3f1ed;
    --fisio: #2f7d6d;      --fisio-claro: #e3f1ed;
    --pilates: #6b5ca5;    --pilates-claro: #ece9f7;
    --avaliacao: #b07a22;  --avaliacao-claro: #f8efdc;
    --perigo: #b4443a;     --perigo-claro: #fbe9e6;
    --aviso: #9a6a00;      --aviso-claro: #fff4d6;
    --raio: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 15px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--tinta); background: var(--fundo); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--primaria) 45%, transparent); outline-offset: 2px; }
  .oculto { display: none !important; }

  /* ---------- Topo ---------- */
  .topo { background: var(--tinta); color: #fff; }
  .topo-interno { max-width: 1040px; margin: 0 auto; padding: 14px 16px 0; }
  .marca { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .marca h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .marca .papel { font-size: 13px; opacity: .75; }
  .marca .direita { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .status-api { display: inline-flex; align-items: center; gap: 6px; opacity: .85; }
  .status-api::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9aa; }
  .status-api.ok::before { background: #6ee7b7; }
  .status-api.erro::before { background: #fca5a5; }
  .btn-topo { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .obs-reposicao { margin-top: 4px; font-size: 12.5px; color: #6b4fa0; font-style: italic; }
  .abas { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
  .aba { background: none; border: 0; color: rgba(255,255,255,.72); padding: 10px 14px; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .aba:hover { color: #fff; }
  .aba[aria-selected="true"] { background: var(--fundo); color: var(--tinta); }
  .contador { background: var(--perigo); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }

  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  .painel { display: grid; gap: 16px; }
  h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.015em; margin: 0; }
  h3 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .subtitulo { color: var(--suave); margin: 2px 0 0; }
  .cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; }
  .cabecalho-linha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cabecalho-linha .fim { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .grade-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .vazio { color: var(--suave); padding: 6px 0; }

  /* ---------- Botões e campos ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--linha); background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn:hover { background: #f4f7f6; }
  .btn.prim { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .btn.prim:hover { background: #276a5c; }
  .btn.perigo { color: var(--perigo); border-color: color-mix(in srgb, var(--perigo) 45%, white); }
  .btn.perigo.cheio { background: var(--perigo); color: #fff; border-color: var(--perigo); }
  .btn.peq { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  .btn.link { border: 0; background: none; color: var(--primaria); padding: 4px 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  label.campo { display: block; font-size: 13px; font-weight: 600; color: var(--suave); margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--linha); border-radius: 9px; background: #fff;
  }
  textarea { min-height: 80px; resize: vertical; }
  .linha-campos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .opcao { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 9px; margin-top: 8px; cursor: pointer; }
  .opcao input { margin-top: 4px; }
  .opcao small { display: block; color: var(--suave); }

  /* ---------- Modalidades (a cor de cada uma é usada em todo lugar) ---------- */
  .mod { --c: var(--suave); --cc: #eef1f0; }
  .mod-FISIOTERAPIA { --c: var(--fisio); --cc: var(--fisio-claro); }
  .mod-PILATES { --c: var(--pilates); --cc: var(--pilates-claro); }
  .mod-AVALIACAO { --c: var(--avaliacao); --cc: var(--avaliacao-claro); }
  .selo-mod { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--c); }
  .selo-mod::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
  .estado { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #eef1f0; color: var(--suave); }
  .estado.verde { background: var(--fisio-claro); color: var(--fisio); }
  .estado.amarelo { background: var(--aviso-claro); color: var(--aviso); }
  .estado.vermelho { background: var(--perigo-claro); color: var(--perigo); }
  .estado.roxo { background: var(--pilates-claro); color: var(--pilates); }

  /* ---------- Entrada ---------- */
  .entrada { max-width: 880px; margin: 24px auto 0; display: grid; gap: 20px; grid-template-columns: 1.1fr .9fr; align-items: start; }
  .entrada .boas-vindas h2 { font-size: 30px; line-height: 1.15; }
  .entrada .boas-vindas p { color: var(--suave); max-width: 46ch; }
  .modalidades-intro { display: grid; gap: 8px; margin-top: 18px; }
  .modalidades-intro div { padding: 10px 12px; border-radius: 10px; background: var(--cc); border-left: 4px solid var(--c); }
  .modalidades-intro b { color: var(--c); }
  .segmentos { display: flex; background: #eef3f1; border-radius: 10px; padding: 3px; gap: 3px; }
  .segmentos button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; color: var(--suave); }
  .segmentos button[aria-pressed="true"] { background: #fff; color: var(--tinta); box-shadow: 0 1px 2px rgba(24,48,43,.12); }
  .contas-teste { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  @media (max-width: 760px) { .entrada { grid-template-columns: 1fr; } }

  /* ---------- Paciente ---------- */
  .proximo-passo { border-left: 5px solid var(--primaria); }
  .proximo-passo.amarelo { border-left-color: var(--aviso); }
  .proximo-passo.vermelho { border-left-color: var(--perigo); }
  .proximo-passo p { margin: 6px 0 12px; color: var(--suave); }
  .faixa { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--pilates-claro); }
  .faixa p { margin: 0; flex: 1; min-width: 200px; }
  .compromisso { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linha); }
  .compromisso:first-child { border-top: 0; }
  .data-bloco { text-align: center; border-radius: 10px; background: var(--cc); color: var(--c); padding: 6px 0; line-height: 1.15; }
  .data-bloco b { display: block; font-size: 20px; }
  .data-bloco span { font-size: 12px; font-weight: 700; }
  .compromisso .acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .compromisso .detalhe { color: var(--suave); font-size: 13px; }
  @media (max-width: 600px) { .compromisso { grid-template-columns: 56px 1fr; } .compromisso .acoes { grid-column: 1 / -1; justify-content: flex-start; } }

  .filtro-mod { display: flex; gap: 8px; flex-wrap: wrap; }
  .filtro-mod button { border: 2px solid var(--linha); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; color: var(--suave); }
  .filtro-mod button[aria-pressed="true"] { border-color: var(--c); background: var(--cc); color: var(--c); }
  .dia-grupo { padding: 12px 0; border-top: 1px solid var(--linha); }
  .dia-grupo:first-child { border-top: 0; }
  .dia-grupo h4 { margin: 0 0 8px; font-size: 14px; }
  .vagas-lista { display: flex; flex-wrap: wrap; gap: 8px; }
  .vaga { border: 1.5px solid var(--c); background: var(--cc); color: var(--tinta); border-radius: 10px; padding: 7px 12px; cursor: pointer; text-align: left; min-width: 112px; }
  .vaga b { display: block; font-size: 15px; }
  .vaga small { color: var(--suave); font-size: 12px; }
  .vaga:hover { background: #fff; }

  /* ---------- Cliente: agenda ---------- */
  .navegador-dia { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .navegador-dia .titulo-dia { font-size: 20px; font-weight: 800; min-width: 220px; }
  .resumo { display: flex; gap: 18px; flex-wrap: wrap; color: var(--suave); font-size: 14px; }
  .resumo b { color: var(--tinta); font-size: 18px; margin-right: 4px; }
  .linha-tempo { display: grid; gap: 10px; }
  .bloco-horario { display: grid; grid-template-columns: 70px 1fr; gap: 0; background: #fff; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
  .bloco-horario .hora { background: var(--cc); color: var(--c); font-weight: 800; padding: 12px 8px; text-align: center; border-right: 4px solid var(--c); }
  .bloco-horario .hora small { display: block; font-weight: 600; font-size: 12px; opacity: .8; }
  .bloco-horario .corpo { padding: 10px 14px; }
  .bloco-horario.bloqueado { opacity: .7; }
  .bloco-horario.bloqueado .hora { background: #f1f1f1; color: #888; border-right-color: #bbb; }
  .bloco-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bloco-topo .fim { margin-left: auto; display: flex; gap: 6px; }
  .pessoa { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px dashed var(--linha); }
  .pessoa:first-of-type { margin-top: 6px; }
  .pessoa .nome { font-weight: 700; min-width: 150px; }
  .pessoa .acoes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  .lista-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--linha); }
  .lista-item:first-child { border-top: 0; }
  .lista-item .texto { flex: 1; min-width: 220px; }
  .lista-item .texto small { display: block; color: var(--suave); }
  .lista-item .acoes { display: flex; gap: 6px; flex-wrap: wrap; }

  .aviso-item { padding: 12px 0 12px 14px; border-top: 1px solid var(--linha); position: relative; }
  .aviso-item:first-child { border-top: 0; }
  .aviso-item.nova::before { content: ""; position: absolute; left: 0; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: var(--perigo); }
  .aviso-item.nova .msg { font-weight: 700; }
  .aviso-item small { color: var(--suave); }

  .pacientes-layout { display: grid; gap: 16px; grid-template-columns: minmax(260px, 1fr) 1.3fr; align-items: start; }
  @media (max-width: 820px) { .pacientes-layout { grid-template-columns: 1fr; } }
  .paciente-linha { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--linha); padding: 10px 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; border-radius: 0; }
  .paciente-linha:hover, .paciente-linha[aria-current="true"] { background: var(--primaria-clara); }
  .paciente-linha small { display: block; color: var(--suave); }
  .ficha dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 0; }
  .ficha dt { color: var(--suave); }
  .ficha dd { margin: 0; }
  .ficha .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .historico-item { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linha); font-size: 14px; flex-wrap: wrap; }
  .registro { padding: 8px 10px; border-radius: 9px; background: var(--fundo); margin-top: 8px; font-size: 14px; }
  .registro small { color: var(--suave); display: block; }

  /* ---------- Diálogo e avisos ---------- */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(480px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(24,48,43,.3); color: var(--tinta); }
  dialog::backdrop { background: rgba(24,48,43,.45); }
  dialog form { padding: 22px; }
  dialog h3 { font-size: 19px; margin: 0 0 6px; }
  dialog .texto { color: var(--suave); margin: 0 0 6px; }
  dialog .botoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); width: max-content; padding: 11px 18px; border-radius: 10px; color: #fff; font-weight: 600; display: none; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #toast.sucesso { background: var(--tinta); }
  #toast.erro { background: var(--perigo); }
  @media (prefers-reduced-motion: no-preference) { #toast { animation: sobe .2s ease-out; } }
  @keyframes sobe { from { transform: translate(-50%, 8px); opacity: 0; } }
</style>
</head>
<body>

<div class="topo">
  <div class="topo-interno">
    <div class="marca">
      <h1>FisioStudio</h1>
      <span class="papel" id="papelTopo">fisioterapia e pilates · página de testes</span>
      <div class="direita">
        <span class="status-api" id="statusApi">conectando…</span>
        <span id="quem"></span>
        <button class="btn-topo oculto" id="btnSair">Sair</button>
      </div>
    </div>
    <nav class="abas" id="abas" role="tablist"></nav>
  </div>
</div>

<main id="conteudo"></main>

<dialog id="dialogo"><form method="dialog" id="dialogoForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ===========================================================================
// Base
// ===========================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const MOD = { AVALIACAO: 'Avaliação', FISIOTERAPIA: 'Fisioterapia', PILATES: 'Pilates' };
/** Nome do atendimento no meio de uma frase: "a aula de pilates de ter., 03/11" */
const ATEND = { AVALIACAO: 'avaliação', FISIOTERAPIA: 'sessão de fisioterapia', PILATES: 'aula de pilates' };
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const SITUACAO = {
  AGUARDANDO_AVALIACAO: ['Aguardando avaliação', 'amarelo'],
  LIBERADO: ['Liberado', 'verde'],
  NAO_LIBERADO: ['Não liberado', 'vermelho'],
  ALTA: ['Alta', 'roxo'],
  INTERROMPIDO: ['Tratamento interrompido', 'vermelho'],
};
const STATUS = {
  AGENDADO: ['Agendado', 'verde'],
  CANCELAMENTO_SOLICITADO: ['Pediu cancelamento', 'amarelo'],
  CANCELADO: ['Cancelado', 'vermelho'],
  REALIZADO: ['Compareceu', 'roxo'],
  FALTA: ['Faltou', 'vermelho'],
};
const selo = (mapa, v) => { const [t, c] = mapa[v] || [v, '']; return `<span class="estado ${c}">${esc(t)}</span>`; };
const seloMod = (m, experimental) => `<span class="mod mod-${m} selo-mod">${MOD[m]}${experimental ? ' · experimental' : ''}</span>`;

const fmtDia = (d) => new Date(d).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
const fmtDiaCurto = (d) => new Date(d).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
const fmtHora = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtQuando = (d) => `${fmtDiaCurto(d)} às ${fmtHora(d)}`;
const fmtData = (iso) => { const [a, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${a}`; };
const diaLocal = (d = new Date()) => new Date(d).toLocaleDateString('sv-SE');
const somarDias = (dia, n) => { const d = new Date(`${dia}T12:00:00`); d.setDate(d.getDate() + n); return diaLocal(d); };
const diaDaSemana = (dia) => new Date(`${dia}T12:00:00`).getDay(); // 0 = domingo
/** Feriados carregados do banco: data AAAA-MM-DD → nome */
let FERIADOS = new Map();
const ehDiaUtil = (dia) => diaDaSemana(dia) >= 1 && diaDaSemana(dia) <= 5 && !FERIADOS.has(dia);
async function carregarFeriados() {
  try {
    const lista = await api('GET', `/feriados?de=${somarDias(diaLocal(), -60)}&ate=${somarDias(diaLocal(), 730)}`);
    FERIADOS = new Map(lista.map((f) => [f.data, f.nome]));
  } catch { /* sem feriados carregados, segue só com fim de semana */ }
}
/** Domingo de Páscoa (para sugerir Carnaval e Corpus Christi) */
function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}
/** Próximo dia útil a partir de "dia" andando na direção dir (1 ou -1); o próprio dia se já for útil e dir = 0. */
const diaUtil = (dia, dir = 0) => { let d = dir ? somarDias(dia, dir) : dia; while (!ehDiaUtil(d)) d = somarDias(d, dir || 1); return d; };
const DIAS_SEMANA = ['', 'segunda', 'terça', 'quarta', 'quinta', 'sexta'];
const DIAS_PLURAL = ['', 'segundas', 'terças', 'quartas', 'quintas', 'sextas'];
const nomeFixo = (f) => `${DIAS_PLURAL[f.dia_semana]} às ${f.hora}`;
const relativo = (d) => {
  const min = Math.round((Date.now() - new Date(d)) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return fmtQuando(d);
};

let sessao = null;
try { sessao = JSON.parse(localStorage.getItem('fisiostudio-sessao') || 'null'); } catch { sessao = null; }

function toast(texto, tipo = 'sucesso') {
  const el = $('#toast');
  el.textContent = texto;
  el.className = tipo;
  el.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (el.style.display = 'none'), tipo === 'erro' ? 6000 : 3200);
}

async function api(metodo, rota, corpo) {
  const r = await fetch(rota, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', ...(sessao ? { Authorization: `Bearer ${sessao.token}` } : {}) },
    body: corpo !== undefined ? JSON.stringify(corpo) : undefined,
  });
  const texto = await r.text();
  const dados = texto ? JSON.parse(texto) : null;
  if (!r.ok) {
    if (r.status === 401 && sessao) { sair(); throw new Error('Sua sessão expirou. Entre de novo.'); }
    const detalhe = dados?.campos?.map((c) => c.mensagem).join('; ');
    throw new Error(detalhe || dados?.erro || `Erro ${r.status}`);
  }
  return dados;
}

/** Roda uma ação, mostra o resultado e redesenha a aba atual. */
async function executar(fn, sucesso) {
  try {
    const r = await fn();
    if (sucesso) toast(typeof sucesso === 'function' ? sucesso(r) : sucesso);
    await desenhar();
    return r;
  } catch (e) {

}

// ---------------------------------------------------------------------------
// Diálogo (substitui prompt/confirm)
//   campos: [{ nome, tipo: 'texto'|'area'|'check'|'radio'|'select', rotulo, ajuda, opcoes, valor, obrigatorio }]
// ---------------------------------------------------------------------------
function perguntar({ titulo, texto = '', campos = [], botao = 'Confirmar', perigo = false }) {
  const dlg = $('#dialogo');
  const form = $('#dialogoForm');
  const campoHtml = (c) => {
    const id = `dlg-${c.nome}`;
    if (c.tipo === 'area') return `<label class="campo" for="${id}">${esc(c.rotulo)}</label>
      <textarea id="${id}" name="${c.nome}" ${c.obrigatorio ? 'required' : ''} placeholder="${esc(c.ajuda || '')}">${esc(c.valor || '')}</textarea>`;
    if (c.tipo === 'check') return `<label class="opcao"><input type="checkbox" name="${c.nome}" ${c.valor ? 'checked' : ''}>
      <span>${esc(c.rotulo)}${c.ajuda ? `<small>${esc(c.ajuda)}</small>` : ''}</span></label>`;
    if (c.tipo === 'radio') return `<div>${c.rotulo ? `<label class="campo">${esc(c.rotulo)}</label>` : ''}${c.opcoes.map((o, i) =>
      `<label class="opcao"><input type="radio" name="${c.nome}" value="${esc(o.valor)}" ${(c.valor ? c.valor === o.valor : i === 0) ? 'checked' : ''}>
      <span>${esc(o.texto)}${o.ajuda ? `<small>${esc(o.ajuda)}</small>` : ''}</span></label>`).join('')}</div>`;
    if (c.tipo === 'select') return `<label class="campo" for="${id}">${esc(c.rotulo)}</label>
      <select id="${id}" name="${c.nome}" ${c.obrigatorio ? 'required' : ''}>
        ${c.opcoes.map((o) => `<option value="${esc(o.valor)}">${esc(o.texto)}</option>`).join('')}</select>`;
    return `<label class="campo" for="${id}">${esc(c.rotulo)}</label>
      <input type="text" id="${id}" name="${c.nome}" value="${esc(c.valor || '')}" ${c.obrigatorio ? 'required' : ''} placeholder="${esc(c.ajuda || '')}">`;
  };
  form.innerHTML = `<h3>${esc(titulo)}</h3>${texto ? `<p class="texto">${texto}</p>` : ''}
    ${campos.map(campoHtml).join('')}
    <div class="botoes">
      <button type="button" class="btn" data-voltar>Voltar</button>
      <button type="submit" class="btn ${perigo ? 'perigo cheio' : 'prim'}" value="ok">${esc(botao)}</button>
    </div>`;
  return new Promise((resolver) => {
    form.querySelector('[data-voltar]').onclick = () => { dlg.close(); resolver(null); };
    form.onsubmit = (e) => {
      e.preventDefault();
      if (!form.reportValidity()) return;
      const valores = {};
      campos.forEach((c) => {
        const el = form.elements[c.nome];
        if (c.tipo === 'check') valores[c.nome] = el.checked;
        else if (c.tipo === 'radio') valores[c.nome] = form.querySelector(`input[name="${c.nome}"]:checked`)?.value;
        else valores[c.nome] = el.value.trim();
      });
      dlg.close();
      resolver(valores);
    };
    dlg.oncancel = () => resolver(null);
    dlg.showModal();
    form.querySelector('textarea, input[type=text], select')?.focus();
  });
}

const ABAS = {
  PACIENTE: [['inicio', 'Início'], ['agendar', 'Agendar'], ['reposicao', 'Reposição'], ['avisos', 'Avisos']],
  ADMIN: [['agenda', 'Agenda'], ['pendencias', 'Pendências'], ['pacientes', 'Pacientes'], ['horarios', 'Abrir horários'], ['feriados', 'Feriados'], ['avisos', 'Avisos']],
};

let contagens = { avisos: 0, pendencias: 0, reposicao: 0 };

function salvarSessao() { try { sessao ? localStorage.setItem('fisiostudio-sessao', JSON.stringify(sessao)) : localStorage.removeItem('fisiostudio-sessao'); } catch {} }

function sair() {
  sessao = null; me = null; abaAtual = null;
  salvarSessao();
  iniciar();
}
$('#btnSair').onclick = sair;

function desenharAbas() {
  const abas = sessao ? ABAS[sessao.papel] : [];
  $('#abas').innerHTML = abas.map(([id, nome]) => {
    const n = contagens[id];
    return `<button class="aba" role="tab" data-aba="${id}" aria-selected="${id === abaAtual}">${nome}${n ? `<span class="contador">${n}</span>` : ''}</button>`;
  }).join('');
}
$('#abas').onclick = (e) => {
  const b = e.target.closest('[data-aba]');
  if (b) irPara(b.dataset.aba);
};

function irPara(aba, opcoes = {}) {
  abaAtual = aba;
  Object.assign(estado, opcoes);
  desenhar();
  window.scrollTo({ top: 0 });
}

async function atualizarContagens() {
  if (!sessao) return;
  const c = await api('GET', '/notificacoes/contagem');
  contagens.avisos = c.nao_lidas;
  if (sessao.papel === 'ADMIN') {
    const p = await api('GET', '/agendamentos/cancelamentos-pendentes');
    contagens.pendencias = p.length;
  } else {
    const r = await api('GET', '/agendamentos/reposicoes-disponiveis');
    contagens.reposicao = r.length;
  }
  desenharAbas();
}

async function desenhar() {
  const main = $('#conteudo');
  if (!sessao) { desenharEntrada(main); desenharAbas(); return; }
  try {
    await atualizarContagens();
    const telas = sessao.papel === 'ADMIN' ? TELAS_CLIENTE : TELAS_PACIENTE;
    await telas[abaAtual](main);
  } catch (e) {
    main.innerHTML = `<div class="cartao"><h3>Não foi possível carregar</h3><p>${esc(e.message)}</p><button class="btn" onclick="desenhar()">Tentar de novo</button></div>`;
  }
}

async function iniciar() {
  $('#btnSair').classList.toggle('oculto', !sessao);
  $('#quem').textContent = '';
  $('#papelTopo').textContent = 'fisioterapia e pilates · página de testes';
  if (sessao) {
    try {
      me = await api('GET', '/auth/me');
      await carregarFeriados();
      $('#quem').textContent = me.nome_completo || me.email;
      $('#papelTopo').textContent = sessao.papel === 'ADMIN' ? 'área da clínica' : 'área do paciente';
      abaAtual = abaAtual || ABAS[sessao.papel][0][0];
    } catch { return; }
  }
  desenhar();
}

const estado = { modalidade: null, reposicao: null, dia: diaUtil(diaLocal()), pacienteSel: null };

const TELAS_PACIENTE = {
  inicio: telaPacienteInicio,
  agendar: telaPacienteAgendar,
  reposicao: telaPacienteReposicao,
  avisos: telaAvisos,
};

const PARA = { PILATES: 'pilates', FISIOTERAPIA: 'fisioterapia', AMBAS: 'pilates e fisioterapia' };

/** Selo com as modalidades liberadas (só faz sentido para paciente liberado). */
function liberacoes(p) {
  const pedido = p.nova_avaliacao_pedida_em ? ' <span class="estado amarelo">Pediu nova avaliação</span>' : '';
  if (p.situacao !== 'LIBERADO' || (p.liberado_pilates && p.liberado_fisioterapia)) return pedido;
  return ` <span class="estado roxo">só ${p.liberado_pilates ? 'pilates' : 'fisioterapia'}</span>${pedido}`;
}

/** Avaliações (PILATES/FISIOTERAPIA) que o paciente já tem marcadas. */
function avaliacoesMarcadas(meus) {
  return meus.filter((a) => a.modalidade === 'AVALIACAO' && ['AGENDADO', 'CANCELAMENTO_SOLICITADO'].includes(a.status))
    .map((a) => a.avaliacao_para);
}

/** Avaliações que o paciente ainda pode marcar: uma de cada modalidade, separadas. */
function avaliacoesPossiveis(p, marcadas = []) {
  if (p.nova_avaliacao_bloqueada) return [];
  let base = [];
  if (p.situacao === 'AGUARDANDO_AVALIACAO') base = ['PILATES', 'FISIOTERAPIA'];
  else if (p.situacao === 'LIBERADO') base = ['PILATES', 'FISIOTERAPIA'].filter((m) => !(m === 'PILATES' ? p.liberado_pilates : p.liberado_fisioterapia));
  return base.filter((m) => !marcadas.includes(m) && !marcadas.includes('AMBAS'));
}

/** O que o paciente pode agendar, conforme a situação e as liberações por modalidade. */
function opcoesDoPaciente(p, marcadas = []) {
  if (!['AGUARDANDO_AVALIACAO', 'LIBERADO'].includes(p.situacao)) return [];
  const op = [];
  if (p.liberado_pilates) op.push(['PILATES', 'Pilates']);
  if (p.liberado_fisioterapia) op.push(['FISIOTERAPIA', 'Fisioterapia']);
  const aval = avaliacoesPossiveis(p, marcadas);
  if (aval.length) op.push(['AVALIACAO', aval.length === 1 ? `Avaliação de ${PARA[aval[0]]}` : 'Avaliação']);
  if (!p.liberado_pilates) op.push(['EXPERIMENTAL', 'Aula experimental de pilates']);
  return op;
}

function proximoPasso(p, marcadas = [], fixos = []) {
  const faltam = avaliacoesPossiveis(p, marcadas);
  // Botão de avaliação só para a modalidade em que ainda não está liberado
  const botoesAvaliacao = faltam.map((m) => [`Avaliação de ${PARA[m]}`, 'AVALIACAO', m]);
  switch (p.situacao) {
    case 'AGUARDANDO_AVALIACAO':
      return marcadas.length
        ? { cor: 'amarelo', titulo: `Sua avaliação de ${marcadas.map((m) => PARA[m]).join(' e de ')} está marcada`,
            texto: `Depois dela, a clínica libera você para a modalidade avaliada.${faltam.length ? ` Se também quiser ${PARA[faltam[0]]}, marque a avaliação de ${PARA[faltam[0]]} separadamente.` : ''} Se quiser conhecer o pilates, marque uma aula experimental.`,
            botoes: [...botoesAvaliacao, ['Aula experimental de pilates', 'EXPERIMENTAL']] }
        : { cor: 'amarelo', titulo: 'Próximo passo: agendar sua avaliação', texto: 'A avaliação é o primeiro atendimento. Cada avaliação é de uma modalidade, pilates ou fisioterapia, e você só poderá agendar a modalidade avaliada. Para as duas, marque uma avaliação de cada. Se tiver interesse em pilates, pode fazer uma aula experimental antes.',
            botoes: [...botoesAvaliacao, ['Aula experimental de pilates', 'EXPERIMENTAL']] };
    case 'LIBERADO': {
      const liberadas = ['PILATES', 'FISIOTERAPIA'].filter((m) => (m === 'PILATES' ? p.liberado_pilates : p.liberado_fisioterapia));
      return { cor: '', titulo: liberadas.length === 2
          ? `Você está liberado(a) para ${MOD[liberadas[0]]} e ${MOD[liberadas[1]]}`
          : `Você está liberado(a) para ${MOD[liberadas[0]]}`,
        texto: p.liberado_pilates && !fixos.length
          ? `Para começar o pilates, escolha seus dias e horários fixos (você pode mudar depois).${p.liberado_fisioterapia ? ' Fisioterapia você agenda quando quiser.' : ''}`
          : liberadas.length === 2 ? 'Agende fisioterapia ou aulas de pilates quando quiser.' : `Agende ${PARA[liberadas[0]]} quando quiser.`,
        botoes: [...liberadas.map((m) => [m === 'PILATES' && !fixos.length ? 'Escolher dias e horários de pilates' : `Agendar ${PARA[m]}`, m]), ...botoesAvaliacao],
        aviso: p.nova_avaliacao_bloqueada ? (p.nova_avaliacao_pedida_em
          ? 'Você pediu uma nova avaliação. Assim que a clínica liberar, você recebe um aviso e pode marcar.'
          : 'Você não foi liberado(a) na última avaliação. Para fazer uma nova avaliação, peça à clínica para liberar.') : '',
        pedirAvaliacao: p.nova_avaliacao_bloqueada && !p.nova_avaliacao_pedida_em };
    }
    case 'NAO_LIBERADO':
      return { cor: 'vermelho', titulo: 'Não liberado na avaliação', texto: p.nova_avaliacao_pedida_em
          ? 'Você pediu uma nova avaliação. Assim que a clínica liberar, você recebe um aviso e pode marcar.'
          : 'Para fazer uma nova avaliação (de pilates ou de fisioterapia), peça à clínica para liberar.',
        botoes: [], pedirAvaliacao: !p.nova_avaliacao_pedida_em };
    case 'ALTA':
      return { cor: '', titulo: 'Você recebeu alta', texto: 'Se precisar voltar, fale com a clínica para reabrir seu cadastro.', botoes: [] };
    default:
      return { cor: 'vermelho', titulo: 'Tratamento interrompido', texto: 'Fale com a clínica para voltar.', botoes: [] };
  }
}

      <p>${passo.texto}</p>
      ${passo.aviso ? `<p class="subtitulo">${passo.aviso}</p>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${passo.botoes.map(([t, m, para], i) => `<button class="btn ${i === 0 ? 'prim' : ''}" data-ir-agendar="${m}"${para ? ` data-avaliacao-para="${para}"` : ''}>${t}</button>`).join('')}${passo.pedirAvaliacao ? `<button class="btn ${passo.botoes.length ? '' : 'prim'}" data-pedir-avaliacao>Pedir nova avaliação</button>` : ''}</div>
    </div>

    ${reposicoes.map((r) => `
      <div class="faixa mod mod-${r.modalidade}" style="background:var(--cc)">
        <p><b>Você pode remarcar</b> a ${ATEND[r.modalidade]} cancelada de ${fmtQuando(r.cancelado_em_horario_de)}${r.motivo_cancelamento ? ` (${esc(r.motivo_cancelamento)})` : ''}.</p>
        <button class="btn prim" data-remarcar-credito="${r.id}">Marcar reposição</button>
      </div>`).join('')}

    ${me.situacao === 'LIBERADO' ? cartaoFixos(fixos) : ''}

    <div class="cartao">
      <h3>Próximos atendimentos</h3>
      ${proximos.length ? proximos.map((a) => compromisso(a, true)).join('') : '<p class="vazio">Nada marcado. Use os botões acima para agendar.</p>'}
    </div>

    ${passados.length ? `<details class="cartao"><summary style="cursor:pointer;font-weight:700">Histórico e cancelados</summary>
      ${passados.map((a) => compromisso(a, false)).join('')}</details>` : ''}
  </div>`;

  main.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.irAgendar) irPara('agendar', { modalidade: b.dataset.irAgendar, reposicao: null, avaliacaoPara: b.dataset.avaliacaoPara || null });
    if (b.dataset.remarcarCredito) irPara('reposicao', { reposicao: b.dataset.remarcarCredito });
    if ('pedirAvaliacao' in b.dataset) {
      const ok = await perguntar({ titulo: 'Pedir nova avaliação', texto: 'A clínica recebe seu pedido. Quando ela liberar, você recebe um aviso e pode marcar a avaliação.', botao: 'Enviar pedido' });
      if (ok) executar(() => api('POST', '/auth/pedir-nova-avaliacao'), 'Pedido enviado. A clínica vai responder.');
    }
    if (b.dataset.confirmar) executar(() => api('POST', `/agendamentos/${b.dataset.confirmar}/confirmar-presenca`), 'Presença confirmada. A clínica foi avisada.');
    if ('fixar' in b.dataset) irPara('agendar', { modalidade: 'PILATES', escolherTurma: true });
    if (b.dataset.desfazerFixo) desfazerFixo(b.dataset.desfazerFixo, b.dataset.nome);
    if (b.dataset.naoVou) avisarNaoVou(b);
  };
}

/** Aviso de falta (botão "Não vou poder ir"): pilates cancela na hora; demais pedem à clínica. */
async function avisarNaoVou(b) {
  const pilates = b.dataset.pilates === 'true';
  // Pilates: cancela na hora; com 30 min ou mais de antecedência ganha remarcação
  const minutos = (new Date(b.dataset.inicio) - new Date()) / 60000;
  const noPrazo = minutos >= 30;
  const explicacao = !pilates
    ? 'A clínica recebe o aviso e responde se aprova o cancelamento.'
    : b.dataset.reposicao === 'true'
      ? 'A aula é cancelada agora e a vaga fica livre para outro aluno.' + (noPrazo ? ' Você pode usar esta remarcação de novo.' : ' Como faltam menos de 30 minutos, ela conta como dada.')
      : noPrazo
        ? 'A aula é cancelada agora, a vaga fica livre para outro aluno e você ganha uma remarcação para outra turma.'
        : 'Faltam menos de 30 minutos (ou a aula já começou): a aula é cancelada e a vaga liberada, mas conta como dada, sem remarcação.';
  const r = await perguntar({
    titulo: 'Avisar que não vai',
    texto: `${esc(b.dataset.desc)}. ${explicacao}`,
    campos: [{ nome: 'motivo', tipo: 'area', rotulo: 'Motivo (opcional)', ajuda: 'Ex.: consulta médica no mesmo horário' }],
    botao: pilates ? 'Cancelar a aula' : 'Avisar a clínica', perigo: true,
  });
  if (r) executar(
    () => api('POST', `/agendamentos/${b.dataset.naoVou}/solicitar-cancelamento`, { motivo: r.motivo || undefined }),
    (x) => !pilates ? 'Aviso enviado. A clínica vai responder.'
      : x.remarcacao_liberada ? 'Aula cancelada. Você ganhou uma remarcação: escolha outro horário quando quiser.'
      : 'Aula cancelada e vaga liberada.',
  );
}

function cartaoFixos(fixos, pacienteId) {
  return `<div class="cartao mod mod-PILATES">
    <div class="cabecalho-linha"><h3 style="margin:0">Horário fixo de pilates</h3>
      ${fixos.length < 2 ? `<div class="fim"><button class="btn ${fixos.length ? '' : 'prim'}" data-fixar ${pacienteId ? `data-paciente="${pacienteId}"` : ''}>${fixos.length ? 'Fixar outro dia' : 'Escolher horário fixo'}</button></div>` : ''}
    </div>
    <p class="subtitulo" style="margin:6px 0 10px">${pacienteId ? 'O aluno pode fixar até 2 turmas; as aulas são reservadas automaticamente, inclusive as que a clínica abrir depois.'
      : 'Até 2 aulas de pilates por semana, em dias diferentes. A vaga fica reservada toda semana. Para mudar, deixe de ser fixo num dia e escolha outro.'}</p>
    ${fixos.length ? fixos.map((f) => `<div class="lista-item">
        <div class="texto"><b>${nomeFixo(f).replace(/^./, (c) => c.toUpperCase())}</b><small>${plural(f.aulas_reservadas, 'aula reservada', 'aulas reservadas')}</small></div>
        <div class="acoes"><button class="btn peq perigo" data-desfazer-fixo="${f.id}" data-nome="${esc(nomeFixo(f))}">Deixar de ser fixo</button></div>
      </div>`).join('') : '<p class="vazio">Nenhum horário fixo ainda.</p>'}
  </div>`;
}

async function fixarTurma(fixos, pacienteId) {
  const turmas = await api('GET', '/pilates/turmas');
  const ocupados = fixos.map((f) => f.dia_semana);
  const livres = turmas.filter((t) => !ocupados.includes(t.dia_semana));
  if (!livres.length) return toast('Não há outras turmas de pilates abertas nos próximos dias.', 'erro');
  const r = await perguntar({
    titulo: 'Escolher horário fixo',
    texto: 'A vaga fica reservada toda semana nessa turma. Se alguma aula estiver cheia ou passar do limite de 2 por semana, ela é pulada.',
    campos: [{ nome: 'turma', tipo: 'select', rotulo: 'Turma', obrigatorio: true, opcoes: livres.map((t) => ({
      valor: `${t.dia_semana}|${t.hora}`,
      texto: `${DIAS_PLURAL[t.dia_semana].replace(/^./, (c) => c.toUpperCase())} às ${t.hora}${t.menor_vaga < 1 ? ' (alguma aula cheia)' : ''}`,
    })) }],
    botao: 'Fixar',
  });
  if (!r) return;
  const [dia_semana, hora] = r.turma.split('|');
  executar(() => api('POST', '/pilates/fixos', { dia_semana: Number(dia_semana), hora, paciente_id: pacienteId }),
    (f) => `Horário fixo definido: ${plural(f.aulas_reservadas, 'aula reservada', 'aulas reservadas')}.`);
}

async function desfazerFixo(id, nome) {
  const r = await perguntar({
    titulo: 'Deixar de ser fixo',
    texto: `Horário fixo das ${esc(nome)}. As próximas aulas reservadas por ele serão canceladas.`,
    botao: 'Deixar de ser fixo', perigo: true,
  });
  if (r) executar(() => api('DELETE', `/pilates/fixos/${id}`), (x) => `Horário fixo encerrado; ${plural(x.aulas_canceladas, 'aula cancelada', 'aulas canceladas')}.`);
}

async function telaPacienteAgendar(main) {
  me = await api('GET', '/auth/me');
  const [reposicoes, meus, fixos] = await Promise.all([
    api('GET', '/agendamentos/reposicoes-disponiveis'), api('GET', '/agendamentos/meus'), api('GET', '/pilates/fixos'),
  ]);
  const marcadas = avaliacoesMarcadas(meus);
  const opcoes = opcoesDoPaciente(me, marcadas);

  if (!opcoes.length) {
    main.innerHTML = `<div class="cartao"><h3>Agendamento indisponível</h3><p>${proximoPasso(me).texto}</p></div>`;
    return;
  }

  if (!opcoes.some(([m]) => m === estado.modalidade)) estado.modalidade = opcoes[0][0];

  const modReal = estado.modalidade === 'EXPERIMENTAL' ? 'PILATES' : estado.modalidade;
  const filtroMod = `<div class="filtro-mod">${opcoes.map(([m, t]) => `<button class="mod mod-${m === 'EXPERIMENTAL' ? 'PILATES' : m}" data-mod="${m}" aria-pressed="${m === estado.modalidade}">${t}</button>`).join('')}</div>`;

  // Pilates sem horário fixo (ou trocando/adicionando um dia): o aluno escolhe
  // a turma (dia e horário) antes de ter aulas
  const creditosPilates = reposicoes.filter((r) => r.modalidade === 'PILATES');
  if (modReal === 'PILATES' && estado.modalidade !== 'EXPERIMENTAL' && (!fixos.length || (estado.escolherTurma && fixos.length < 2))) {
    const turmas = await api('GET', '/pilates/turmas');
    const diasFixos = fixos.map((f) => f.dia_semana);
    const porDia = {};
    turmas.filter((t) => !diasFixos.includes(t.dia_semana)).forEach((t) => { (porDia[t.dia_semana] ||= []).push(t); });
    main.innerHTML = `<div class="painel">
      <div><h2>Escolha seus dias e horários</h2><p class="subtitulo">${fixos.length
        ? `Você faz pilates nas ${fixos.map((f) => nomeFixo(f)).join(' e ')}. Escolha mais um dia (até 2 por semana, em dias diferentes).`
        : 'Antes de marcar aulas de pilates, escolha a turma (dia e horário) que você vai fazer toda semana. Até 2 dias por semana, em dias diferentes. Você pode mudar depois.'}</p></div>
      ${fixos.length ? '<div><button class="btn" data-voltar-aulas>Voltar para minhas aulas</button></div>' : filtroMod}
      ${creditosPilates.length ? `
        <div class="faixa mod mod-PILATES" style="background:var(--cc)">
          <p><b>Você tem ${plural(creditosPilates.length, 'reposição', 'reposições')}</b> para marcar.</p>
          <button class="btn" data-ir-reposicao>Marcar reposição</button>
        </div>` : ''}
      <div class="cartao">
        ${Object.keys(porDia).length ? Object.entries(porDia).map(([dia, lista]) => `
          <div class="dia-grupo">
            <h4>${DIAS_PLURAL[dia].replace(/^./, (c) => c.toUpperCase())}</h4>
            <div class="vagas-lista">${lista.map((t) => `
              <button class="vaga mod mod-PILATES" data-turma="${t.dia_semana}|${t.hora}" data-nome="${esc(DIAS_PLURAL[t.dia_semana] + ' às ' + t.hora)}">
                <b>${t.hora}</b>
                <small>${t.menor_vaga < 1 ? 'alguma aula cheia' : plural(t.menor_vaga, 'vaga', 'vagas')}</small>
              </button>`).join('')}</div>
          </div>`).join('') : '<p class="vazio">Não há turmas de pilates abertas nos próximos dias. Fale com a clínica.</p>'}
      </div>
    </div>`;
    main.onclick = async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.mod) { estado.modalidade = b.dataset.mod; desenhar(); }
      if ('voltarAulas' in b.dataset) { estado.escolherTurma = false; desenhar(); }
      if ('irReposicao' in b.dataset) irPara('reposicao', { reposicao: null });
      if (b.dataset.turma) {
        const ok = await perguntar({
          titulo: 'Confirmar dia e horário',
          texto: `Pilates nas <b>${esc(b.dataset.nome)}</b>. A vaga fica reservada toda semana; se alguma aula estiver cheia, ela é pulada. Você pode mudar depois.`,
          botao: 'Escolher este horário',
        });
        if (!ok) return;
        const [dia_semana, hora] = b.dataset.turma.split('|');
        executar(() => api('POST', '/pilates/fixos', { dia_semana: Number(dia_semana), hora }).then((f) => { estado.escolherTurma = false; return f; }),
          (f) => `Pronto! ${plural(f.aulas_reservadas, 'aula reservada', 'aulas reservadas')}.`);
      }
    };
    return;
  }

  // Aluno matriculado (com horário fixo): no pilates aparecem só as aulas das
  // turmas dele, para confirmar presença ou avisar falta. Outros horários com
  // vaga, só usando uma remarcação.
  if (modReal === 'PILATES' && estado.modalidade !== 'EXPERIMENTAL' && fixos.length) {
    const agora = new Date();
    const limite = new Date(agora.getTime() + 21 * 86400000);
    const aulas = meus.filter((a) => a.modalidade === 'PILATES' && !a.experimental && (a.fixo_id || a.reposicao_de) && a.status === 'AGENDADO'
      && new Date(a.fim) > agora && new Date(a.inicio) < limite)
      .sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
    const creditos = creditosPilates;
    main.innerHTML = `<div class="painel">
      <div><h2>Agendar</h2><p class="subtitulo">Você é matriculado(a) em ${fixos.map((f) => nomeFixo(f)).join(' e ')}. Aqui aparecem as aulas das suas turmas (e as reposições marcadas) nas próximas 3 semanas.</p></div>
      ${filtroMod}
      ${creditos.length ? `
        <div class="faixa mod mod-PILATES" style="background:var(--cc)">
          <p><b>Você tem ${plural(creditos.length, 'reposição', 'reposições')}</b> para marcar. Com ela, você escolhe outro dia e horário com vaga, em qualquer turma.</p>
          <button class="btn prim" data-ir-reposicao>Marcar reposição</button>
        </div>` : ''}
      <div class="cartao">
        <h3>Suas aulas nas próximas 3 semanas</h3>
        ${aulas.length ? aulas.map((a) => `
          <div class="compromisso">
            <div class="data-bloco mod mod-PILATES"><b>${new Date(a.inicio).getDate()}</b><span>${new Date(a.inicio).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}</span></div>
            <div><div><b>${fmtDia(a.inicio)}</b> às ${fmtHora(a.inicio)}</div>
              <div class="detalhe">${a.presenca_confirmada_em ? '<span class="estado verde">Presença confirmada</span>' : '<span class="estado">Agendado</span>'}${a.reposicao_de ? ' <span class="estado roxo">Reposição</span>' : ''}</div>
              ${a.reposicao_de ? `<div class="obs-reposicao">Reposição da aula de ${fmtQuando(a.reposicao_de_inicio)}</div>` : ''}</div>
            <div class="acoes">
              ${a.presenca_confirmada_em || new Date(a.inicio) <= agora ? '' : `<button class="btn peq prim" data-confirmar="${a.id}">Confirmar presença</button>`}
              <button class="btn peq perigo" data-nao-vou="${a.id}" data-inicio="${a.inicio}" data-pilates="true" data-reposicao="${!!a.reposicao_de}" data-desc="${esc('Aula de pilates de ' + fmtQuando(a.inicio))}">Não vou poder ir</button>
            </div>
          </div>`).join('') : '<p class="vazio">Nenhuma aula das suas turmas nas próximas 3 semanas.</p>'}
      </div>
      ${cartaoFixos(fixos)}
    </div>`;
    main.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.mod) { estado.modalidade = b.dataset.mod; desenhar(); }
      if ('irReposicao' in b.dataset) irPara('reposicao', { reposicao: null });
      if ('fixar' in b.dataset) { estado.escolherTurma = true; desenhar(); }
      if (b.dataset.desfazerFixo) desfazerFixo(b.dataset.desfazerFixo, b.dataset.nome);
      if (b.dataset.confirmar) executar(() => api('POST', `/agendamentos/${b.dataset.confirmar}/confirmar-presenca`), 'Presença confirmada. A clínica foi avisada.');
      if (b.dataset.naoVou) avisarNaoVou(b);
    };
    return;
  }

  const horarios = await api('GET', `/horarios?modalidade=${modReal}`);
  const porDia = {};
  horarios.forEach((h) => { (porDia[diaLocal(h.inicio)] ||= []).push(h); });

  main.innerHTML = `<div class="painel">
    <div><h2>Agendar</h2><p class="subtitulo">Escolha o tipo de atendimento e toque num horário livre.</p></div>
    ${reposicoes.length ? `
      <div class="faixa" style="background:var(--cc)">
        <p><b>Você tem ${plural(reposicoes.length, 'reposição', 'reposições')}</b> para marcar.</p>
        <button class="btn" data-ir-reposicao>Marcar reposição</button>
      </div>` : ''}
    ${filtroMod}
    <div class="cartao">
      ${Object.keys(porDia).length ? Object.entries(porDia).map(([dia, lista]) => `
        <div class="dia-grupo">
          <h4>${fmtDia(`${dia}T12:00:00`)}</h4>
          <div class="vagas-lista">${lista.map((h) => `
            <button class="vaga mod mod-${h.modalidade}" data-horario="${h.id}" data-quando="${esc(fmtDia(h.inicio) + ' às ' + fmtHora(h.inicio))}">
              <b>${fmtHora(h.inicio)}</b>
              <small>${h.capacidade > 1 ? plural(h.vagas_restantes, 'vaga livre', 'vagas livres') : 'livre'}</small>
            </button>`).join('')}</div>
        </div>`).join('') : `<p class="vazio">Nenhum horário livre de ${MOD[modReal].toLowerCase()} no momento. Volte mais tarde ou fale com a clínica.</p>`}
    </div>
  </div>`;

  main.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if ('irReposicao' in b.dataset) irPara('reposicao', { reposicao: null });
    if ('irInicio' in b.dataset) irPara('inicio');
    if (b.dataset.mod) { estado.modalidade = b.dataset.mod; desenhar(); }
    if (b.dataset.horario) {
      const experimental = estado.modalidade === 'EXPERIMENTAL';
      const avaliacao = modReal === 'AVALIACAO';
      const nome = experimental ? 'Aula experimental de pilates' : MOD[modReal];
      // Avaliação: o paciente escolhe para qual modalidade ela é
      const escolhas = avaliacao ? avaliacoesPossiveis(me, marcadas) : [];
      const ok = await perguntar({
        titulo: `Agendar ${nome.toLowerCase()}`,
        texto: `<b>${esc(nome)}</b> — ${esc(b.dataset.quando)}.<br>A clínica será avisada.`,
        campos: avaliacao ? [{
          nome: 'para', tipo: 'radio', rotulo: 'A avaliação é para',
          valor: escolhas.includes(estado.avaliacaoPara) ? estado.avaliacaoPara : undefined,
          opcoes: escolhas.map((v) => ({ valor: v, texto: MOD[v], ajuda: `Se liberado, pode agendar ${PARA[v]}.` })),
        }] : [],
        botao: 'Agendar',
      });
      if (!ok) return;
      const r = await executar(() => api('POST', '/agendamentos', {
        horario_id: b.dataset.horario,
        experimental: experimental || undefined,
        avaliacao_para: avaliacao ? ok.para : undefined,
      }), 'Agendado! A clínica foi avisada.');
      if (r) irPara('inicio');
    }
  };
}

    </div>`;
    main.onclick = null;

      <h3>${reposicoes.length > 1 ? 'Qual reposição você vai usar?' : 'Sua reposição'}</h3>
      ${reposicoes.map((r) => `
        <div class="lista-item">
          <div class="texto"><b>${MOD[r.modalidade]} de ${fmtQuando(r.cancelado_em_horario_de)}</b>
            <small>${r.motivo_cancelamento ? esc(r.motivo_cancelamento) : 'Aula cancelada'}</small></div>
          <div class="acoes">${r.id === credito.id ? '<span class="estado verde">Selecionada</span>'
            : `<button class="btn peq" data-credito="${r.id}">Usar esta</button>`}</div>
        </div>`).join('')}
    </div>
    <div class="cartao">
      <h3>Dias e horários disponíveis de ${MOD[credito.modalidade].toLowerCase()}</h3>
      ${Object.keys(porDia).length ? Object.entries(porDia).map(([dia, lista]) => `
        <div class="dia-grupo">
          <h4>${fmtDia(`${dia}T12:00:00`)}</h4>
          <div class="vagas-lista">${lista.map((h) => `
            <button class="vaga mod mod-${h.modalidade}" data-horario="${h.id}" data-quando="${esc(fmtDia(h.inicio) + ' às ' + fmtHora(h.inicio))}">
              <b>${fmtHora(h.inicio)}</b>
              <small>${h.capacidade > 1 ? plural(h.vagas_restantes, 'vaga livre', 'vagas livres') : 'livre'}</small>
            </button>`).join('')}</div>
        </div>`).join('') : `<p class="vazio">Nenhum horário com vaga de ${MOD[credito.modalidade].toLowerCase()} no momento. Volte mais tarde ou fale com a clínica.</p>`}
    </div>
  </div>`;

  main.onclick = async (e) => {
    const b = e.target.closest('button');

    if (b.dataset.credito) { estado.reposicao = b.dataset.credito; desenhar(); }
    if (b.dataset.horario) {
      const ok = await perguntar({
        titulo: 'Confirmar reposição',
        texto: `<b>${esc(MOD[credito.modalidade])}</b> — ${esc(b.dataset.quando)}.<br>Reposição da aula de ${esc(fmtQuando(credito.cancelado_em_horario_de))}. A clínica será avisada.`,
        botao: 'Marcar reposição',
      });
      if (!ok) return;
      const r = await executar(() => api('POST', '/agendamentos', { horario_id: b.dataset.horario, reposicao_de: credito.id }),
        'Reposição marcada! A clínica foi avisada.');
      if (r) irPara('inicio', { reposicao: null });
    }
  };
}

async function telaAgenda(main) {
  const dia = estado.dia;
  const inicio = new Date(`${dia}T00:00:00`);
  const fim = new Date(inicio.getTime() + 86400000);
  const [agendamentos, horarios] = await Promise.all([
    api('GET', `/agendamentos?data=${dia}`),
    api('GET', `/horarios?de=${encodeURIComponent(inicio.toISOString())}&ate=${encodeURIComponent(fim.toISOString())}`),
  ]);
  const ativos = agendamentos.filter((a) => a.status !== 'CANCELADO');
  const confirmados = ativos.filter((a) => a.presenca_confirmada_em && a.status === 'AGENDADO').length;
  const pedidos = ativos.filter((a) => a.status === 'CANCELAMENTO_SOLICITADO').length;
  const ehHoje = dia === diaLocal();
  const feriado = FERIADOS.get(dia);
  const fimDeSemana = diaDaSemana(dia) === 0 || diaDaSemana(dia) === 6;
  const passou = (h) => new Date(h.inicio) <= new Date();

  const pessoa = (a, h) => {
    const ativo = ['AGENDADO', 'CANCELAMENTO_SOLICITADO'].includes(a.status);
    const desc = `${a.nome_completo} — ${a.experimental ? 'aula experimental' : ATEND[a.modalidade]} de ${fmtQuando(a.inicio)}`;
    return `<div class="pessoa">
      <span class="nome">${esc(a.nome_completo)}</span>
      ${a.avaliacao_para ? `<span class="estado amarelo">Avaliação de ${PARA[a.avaliacao_para]}</span>` : ''}
      ${a.experimental ? '<span class="estado roxo">Experimental</span>' : ''}
      ${a.reposicao_de ? `<span class="estado roxo">Reposição da aula de ${fmtQuando(a.reposicao_de_inicio)}</span>` : ''}
      ${a.fixo_id ? '<span class="estado roxo">Fixo</span>' : ''}
      ${selo(STATUS, a.status)}
      ${a.presenca_confirmada_em && a.status === 'AGENDADO' ? '<span class="estado verde">Confirmou presença</span>' : ''}
      <div class="acoes">
        ${a.status === 'AGENDADO' && a.modalidade === 'AVALIACAO' ? `<button class="btn peq prim" data-avaliar="${a.id}" data-para="${a.avaliacao_para || 'AMBAS'}" data-desc="${esc(desc)}">Concluir avaliação</button>` : ''}
        ${a.status === 'AGENDADO' && a.modalidade !== 'AVALIACAO' && passou(h) ? `
          <button class="btn peq prim" data-presenca="${a.id}" data-veio="true">Veio</button>
          <button class="btn peq" data-presenca="${a.id}" data-veio="false">Faltou</button>` : ''}
        ${a.status === 'CANCELAMENTO_SOLICITADO' ? `<button class="btn peq prim" data-decidir="${a.id}" data-desc="${esc(desc)}" data-modalidade="${a.modalidade}" data-exp="${a.experimental}" data-motivo="${esc(a.motivo_cancelamento || '')}">Responder pedido</button>` : ''}
        ${ativo && !passou(h) ? `<button class="btn peq" data-remarcar="${a.id}" data-modalidade="${a.modalidade}" data-desc="${esc(desc)}">Remarcar</button>` : ''}
        ${ativo ? `<button class="btn peq perigo" data-cancelar="${a.id}" data-desc="${esc(desc)}" data-exp="${a.experimental}">Cancelar</button>` : ''}
        ${a.status === 'REALIZADO' ? `<button class="btn peq" data-registrar="${a.paciente_id}" data-agendamento="${a.id}" data-nome="${esc(a.nome_completo)}">Registrar sessão</button>` : ''}
      </div>
    </div>`;
  };

  const blocos = horarios.map((h) => {
    const daqui = agendamentos.filter((a) => a.horario_id === h.id);
    const ativosAqui = daqui.filter((a) => a.status !== 'CANCELADO');
    const cancelados = daqui.length - ativosAqui.length;
    return `<div class="bloco-horario mod mod-${h.modalidade} ${h.bloqueado ? 'bloqueado' : ''}">
      <div class="hora">${fmtHora(h.inicio)}<small>até ${fmtHora(h.fim)}</small></div>
      <div class="corpo">
        <div class="bloco-topo">
          ${seloMod(h.modalidade)}
          <span class="subtitulo" style="margin:0">${h.bloqueado ? 'Bloqueado' : h.capacidade > 1 ? `${ativosAqui.length} de ${h.capacidade} vagas ocupadas` : ativosAqui.length ? 'Ocupado' : 'Livre'}${cancelados ? ` · ${plural(cancelados, 'cancelado', 'cancelados')}` : ''}</span>
          <div class="fim">
            ${!h.bloqueado && h.vagas_restantes > 0 && !passou(h) ? `<button class="btn peq" data-agendar-por="${h.id}" data-modalidade="${h.modalidade}" data-quando="${esc(fmtQuando(h.inicio))}">+ Agendar paciente</button>` : ''}
            <button class="btn peq link" data-bloquear="${h.id}" data-valor="${!h.bloqueado}">${h.bloqueado ? 'Desbloquear' : 'Bloquear'}</button>
          </div>
        </div>
        ${ativosAqui.map((a) => pessoa(a, h)).join('')}
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `<div class="painel">
    <div class="cabecalho-linha">
      <div class="navegador-dia">
        <button class="btn" data-dia="-1" aria-label="Dia anterior">‹</button>
        <div class="titulo-dia">${ehHoje ? 'Hoje' : fmtDia(`${dia}T12:00:00`)}</div>
        <button class="btn" data-dia="1" aria-label="Próximo dia">›</button>
        ${dia === diaUtil(diaLocal()) ? '' : `<button class="btn link" data-dia="hoje">${ehDiaUtil(diaLocal()) ? 'Voltar para hoje' : 'Próximo dia útil'}</button>`}
        <input type="date" id="escolherDia" value="${dia}" style="width:auto">
      </div>
      <div class="fim">${feriado || fimDeSemana ? '' : `<button class="btn perigo" id="cancelarDia" ${ativos.length ? '' : 'disabled'}>Cancelar o dia</button>`}</div>
    </div>
    <div class="resumo ${feriado || fimDeSemana ? 'oculto' : ''}">
      <span><b>${ativos.length}</b>${ativos.length === 1 ? 'atendimento' : 'atendimentos'}</span>
      <span><b>${confirmados}</b>${confirmados === 1 ? 'confirmou presença' : 'confirmaram presença'}</span>
      ${pedidos ? `<span style="color:var(--aviso)"><b style="color:var(--aviso)">${pedidos}</b>${pedidos === 1 ? 'pedido de cancelamento' : 'pedidos de cancelamento'}</span>` : ''}
    </div>
    ${feriado ? `
      <div class="cartao proximo-passo amarelo"><h3>Feriado: ${esc(feriado)}</h3><p class="subtitulo">A clínica não abre neste dia, então não há atendimento.${horarios.length ? ' Os atendimentos que estavam marcados foram cancelados e os pacientes avisados.' : ''}</p></div>` : ''}
    ${fimDeSemana && !feriado ? `
      <div class="cartao"><h3>Fim de semana</h3><p class="subtitulo">A clínica funciona de segunda a sexta.${horarios.length ? ' Os atendimentos que estavam marcados foram cancelados e os pacientes avisados.' : ''}</p></div>` : feriado || fimDeSemana ? '' : horarios.length ? `<div class="linha-tempo">${blocos}</div>` : `
      <div class="cartao"><h3>Nenhum horário aberto neste dia</h3>
      <p class="subtitulo">Abra horários para os pacientes poderem agendar.</p>
      <p><button class="btn prim" data-abrir-horarios>Abrir horários neste dia</button></p></div>`}
  </div>`;

  $('#escolherDia', main).onchange = (e) => { estado.dia = e.target.value || diaUtil(diaLocal()); desenhar(); };
  main.onclick = (e) => acoesAgenda(e, horarios);
}

async function escolherHorarioParaRemarcar(modalidade, desc) {
  const de = new Date().toISOString();
  const lista = (await api('GET', `/horarios?modalidade=${modalidade}&de=${encodeURIComponent(de)}`))
    .filter((h) => !h.bloqueado && h.vagas_restantes > 0).slice(0, 60);
  if (!lista.length) { toast('Não há horários livres desta modalidade. Abra novos horários antes.', 'erro'); return null; }
  return perguntar({
    titulo: 'Remarcar',
    texto: `${esc(desc)}. O paciente recebe um aviso com o novo horário.`,
    campos: [{ nome: 'horario', tipo: 'select', rotulo: 'Novo horário', obrigatorio: true,
      opcoes: lista.map((h) => ({ valor: h.id, texto: `${fmtQuando(h.inicio)}${h.capacidade > 1 ? ` · ${h.vagas_restantes} vaga(s)` : ''}` })) }],
    botao: 'Remarcar',
  });
}

async function acoesAgenda(e) {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.dia) { estado.dia = d.dia === 'hoje' ? diaUtil(diaLocal()) : diaUtil(estado.dia, Number(d.dia)); return desenhar(); }
  if ('abrirHorarios' in d) return irPara('horarios');

  if (b.id === 'cancelarDia') {
    const r = await perguntar({
      titulo: `Cancelar ${estado.dia === diaLocal() ? 'hoje' : fmtDia(`${estado.dia}T12:00:00`)}`,
      texto: 'Todos os atendimentos do dia serão cancelados e cada paciente recebe um aviso com a sua mensagem.',
      campos: [
        { nome: 'motivo', tipo: 'area', rotulo: 'Mensagem para os pacientes', obrigatorio: true, ajuda: 'Ex.: A clínica estará fechada para manutenção elétrica.' },
        { nome: 'liberar', tipo: 'check', rotulo: 'Deixar os pacientes remarcarem', ajuda: 'Cada um escolhe um novo horário da mesma modalidade.', valor: true },
        { nome: 'bloquear', tipo: 'check', rotulo: 'Bloquear os horários do dia', ajuda: 'Ninguém mais consegue agendar neste dia.', valor: true },
      ],
      botao: 'Cancelar o dia e avisar', perigo: true,
    });
    if (r) executar(() => api('POST', '/agendamentos/cancelar-em-lote', {
      data: estado.dia, motivo: r.motivo, liberar_remarcacao: r.liberar, bloquear_horarios: r.bloquear,
    }), (x) => `${plural(x.agendamentos_cancelados.length, 'atendimento cancelado', 'atendimentos cancelados')}; ${plural(x.pacientes_avisados, 'paciente avisado', 'pacientes avisados')}.`);
    return;
  }

  if (d.avaliar) {
    // Avaliação de uma modalidade libera só ela; a de "ambas" pode liberar as duas ou só uma
    const opcoes = d.para === 'AMBAS'
      ? [
          { valor: 'LIBERADO:AMBAS', texto: 'Liberar para pilates e fisioterapia' },
          { valor: 'LIBERADO:PILATES', texto: 'Liberar só para pilates' },
          { valor: 'LIBERADO:FISIOTERAPIA', texto: 'Liberar só para fisioterapia' },
        ]
      : [{ valor: `LIBERADO:${d.para}`, texto: `Liberar para ${PARA[d.para]}`, ajuda: `Pode agendar ${PARA[d.para]}.` }];
    opcoes.push({ valor: 'NAO_LIBERADO:', texto: 'Não liberar', ajuda: 'Se já estiver liberado para a outra modalidade, continua com ela; senão, só você reabre depois.' });
    const r = await perguntar({
      titulo: `Concluir avaliação de ${PARA[d.para]}`, texto: esc(d.desc),
      campos: [
        { nome: 'resultado', tipo: 'radio', opcoes },
        { nome: 'observacoes', tipo: 'area', rotulo: 'Observações da avaliação', ajuda: 'Ex.: dor lombar leve; indicado pilates 2x por semana' },
      ],
      botao: 'Concluir',
    });
    if (r) {
      const [resultado, liberar] = r.resultado.split(':');
      executar(() => api('POST', `/agendamentos/${d.avaliar}/avaliacao`, {
        resultado, liberar_para: liberar || undefined, observacoes: r.observacoes || undefined,
      }), resultado === 'LIBERADO' ? `Paciente liberado para ${PARA[liberar]} e avisado.` : 'Avaliação registrada; paciente avisado.');
    }
  }

  if (d.presenca) executar(() => api('POST', `/agendamentos/${d.presenca}/presenca`, { compareceu: d.veio === 'true' }), d.veio === 'true' ? 'Presença registrada' : 'Falta registrada');

  if (d.decidir) responderPedido(d);

  if (d.remarcar) {
    const r = await escolherHorarioParaRemarcar(d.modalidade, d.desc);
    if (r) executar(() => api('POST', `/agendamentos/${d.remarcar}/remarcar`, { horario_id: r.horario }), 'Remarcado. O paciente foi avisado.');
  }

  if (d.cancelar) {
    const campos = [{ nome: 'motivo', tipo: 'area', rotulo: 'Mensagem para o paciente', ajuda: 'Ex.: imprevisto com a profissional' }];
    if (d.exp !== 'true') campos.push({ nome: 'liberar', tipo: 'check', rotulo: 'Deixar o paciente remarcar', ajuda: 'Ele escolhe um novo horário da mesma modalidade.', valor: true });
    const r = await perguntar({ titulo: 'Cancelar atendimento', texto: esc(d.desc), campos, botao: 'Cancelar e avisar', perigo: true });
    if (r) executar(() => api('POST', `/agendamentos/${d.cancelar}/cancelar`, { motivo: r.motivo || undefined, liberar_remarcacao: !!r.liberar }), 'Cancelado. O paciente foi avisado.');
  }

  if (d.registrar) registrarSessao(d.registrar, d.nome, d.agendamento);

  if (d.bloquear) executar(() => api('PATCH', `/horarios/${d.bloquear}`, { bloqueado: d.valor === 'true' }), d.valor === 'true' ? 'Horário bloqueado' : 'Horário desbloqueado');

  if (d.agendarPor) {
    const situacoes = d.modalidade === 'AVALIACAO' ? 'AGUARDANDO_AVALIACAO' : 'LIBERADO';
    const pacientes = await api('GET', `/pacientes?situacao=${situacoes}`);
    if (!pacientes.length) return toast(d.modalidade === 'AVALIACAO' ? 'Nenhum paciente aguardando avaliação.' : 'Nenhum paciente liberado.', 'erro');
    const campos = [{ nome: 'paciente', tipo: 'select', rotulo: 'Paciente', obrigatorio: true, opcoes: pacientes.map((p) => ({ valor: p.id, texto: p.nome_completo })) }];
    if (d.modalidade === 'AVALIACAO') {
      campos.push({ nome: 'para', tipo: 'radio', rotulo: 'A avaliação é para', opcoes: [
        { valor: 'PILATES', texto: 'Pilates' }, { valor: 'FISIOTERAPIA', texto: 'Fisioterapia' },
      ] });
    }
    const r = await perguntar({
      titulo: `Agendar ${ATEND[d.modalidade]}`, texto: `${esc(d.quando)}. O paciente recebe um aviso.`,
      campos, botao: 'Agendar',
    });
    if (r) executar(() => api('POST', '/agendamentos/pela-clinica', {
      paciente_id: r.paciente, horario_id: d.agendarPor, avaliacao_para: r.para || undefined,
    }), 'Agendado. O paciente foi avisado.');
  }
}

async function responderPedido(d) {
  const podeRepor = d.modalidade === 'PILATES' && d.exp !== 'true';
  const opcoes = [];
  if (podeRepor) opcoes.push({ valor: 'repor', texto: 'Aprovar e liberar reposição', ajuda: 'O aluno escolhe outra aula de pilates.' });
  opcoes.push({ valor: 'aprovar', texto: podeRepor ? 'Aprovar sem reposição' : 'Aprovar o cancelamento' });
  opcoes.push({ valor: 'recusar', texto: 'Recusar', ajuda: 'O agendamento continua de pé.' });
  const r = await perguntar({
    titulo: 'Pedido de cancelamento',
    texto: `${esc(d.desc)}${d.motivo ? `<br>Motivo: <i>${esc(d.motivo)}</i>` : ''}`,
    campos: [{ nome: 'decisao', tipo: 'radio', opcoes }],
    botao: 'Responder',
  });
  if (r) executar(() => api('POST', `/agendamentos/${d.decidir}/decidir-cancelamento`, {
    aprovar: r.decisao !== 'recusar', liberar_reposicao: r.decisao === 'repor',
  }), r.decisao === 'recusar' ? 'Pedido recusado. O paciente foi avisado.' : 'Cancelamento aprovado. O paciente foi avisado.');
}

async function registrarSessao(pacienteId, nome, agendamentoId) {
  const r = await perguntar({
    titulo: 'Registrar sessão', texto: esc(nome),
    campos: [{ nome: 'obs', tipo: 'area', rotulo: 'Observações da sessão', obrigatorio: true, ajuda: 'Ex.: ganho de amplitude; manter exercícios em casa' }],
    botao: 'Salvar registro',
  });
  if (r) executar(() => api('POST', '/registros', {
    paciente_id: pacienteId, agendamento_id: agendamentoId || undefined, data_atendimento: estado.dia || diaLocal(), observacoes: r.obs,
  }), 'Sessão registrada.');
}

          <div class="texto"><b>${esc(a.nome_completo)}</b> ${seloMod(a.modalidade, a.experimental)}
            <small>${fmtQuando(a.inicio)}${a.motivo_cancelamento ? ` · ${esc(a.motivo_cancelamento)}` : ''}</small></div>
          <div class="acoes"><button class="btn prim peq" data-decidir="${a.id}" data-desc="${esc(desc)}" data-modalidade="${a.modalidade}" data-exp="${a.experimental}" data-motivo="${esc(a.motivo_cancelamento || '')}">Responder</button></div>

          : '<p class="vazio">Nenhum paciente com faltas repetidas.</p>'}
